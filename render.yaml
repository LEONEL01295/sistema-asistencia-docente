services:
  - type: web
    name: asistencia-docente-itsh
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: JWT_SECRET
        generateValue: true
      - key: DEVICE_SHARED_KEY
        generateValue: true
      - key: TIMEZONE
        value: America/Mexico_City
      - key: DB_FILE
        value: /opt/render/project/src/data/asistencia.db
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: asistencia-data
      mountPath: /opt/render/project/src/data
